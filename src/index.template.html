<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{SHORT_TITLE}}">
  <meta name="generator" content="scripts/build.mjs">
  <meta name="x-data-version" content="{{DATA_VERSION}}">
  <meta name="x-generated-at" content="{{GENERATED_AT}}">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,{{FAVICON}}">
  <title>{{TITLE}}</title>
  <style>{{STYLES}}</style>
</head>
<body>

  <!-- Giris ekrani: tiklanabilir oldugu icin gercek bir <button> -->
  <button id="splash" class="splash" type="button" aria-label="{{TITLE}} uygulamasini baslat">
    <span class="splash__mark">
      <span class="splash__glow"></span>
      <span class="splash__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2.2"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.5"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)"/>
        </svg>
      </span>
    </span>

    <h1 class="splash__title">
      <span>PET/BT</span>
      <span class="accent">SGK REHBERI</span>
    </h1>

    <span class="splash__cta">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      Baslamak icin dokunun
    </span>

    <span class="splash__footer">Gelistirici: {{AUTHOR}}</span>
  </button>

  <!-- Ana uygulama -->
  <div id="app" class="app is-entering" hidden>

    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </span>
        <div class="topbar__titles">
          <h1 class="topbar__title">{{TITLE}}</h1>
          <p class="topbar__subtitle" id="app-subtitle">&nbsp;</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="btn-theme" class="icon-btn" type="button" aria-label="Temayi degistir"></button>
      </div>
    </header>

    <nav class="trail" id="trail" hidden aria-label="Izlenen yol">
      <ol class="trail__list" id="trail-list"></ol>
    </nav>

    <main class="card">
      <div class="card__body" id="wizard-body"></div>
      <div class="card__footer">
        <button id="btn-back" class="btn-ghost" type="button" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Geri
        </button>
        <button id="btn-reset" class="btn-dark" type="button">Bastan basla</button>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__meta">Gelistirici: <span id="app-author"></span> &middot; <span id="data-version"></span></p>
      <p>{{DISCLAIMER}}</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

  <noscript>
    <div class="app" style="opacity:1">
      <div class="card"><div class="card__body">
        <h2 class="question">JavaScript gerekli</h2>
        <p class="hint">Bu karar destek araci calismak icin JavaScript kullanir. Lutfen tarayicinizda JavaScript'i etkinlestirin.</p>
      </div></div>
    </div>
  </noscript>

  <script type="application/json" id="bundle-snapshot">{{BUNDLE}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
