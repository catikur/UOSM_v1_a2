name: SUT kaynak izleme

# Resmi kaynaklari duzenli araliklarla kontrol eder. Degisiklik bulursa
# insan incelemesi icin bir konu (issue) acar. Veriyi KENDILIGINDEN
# degistirmez: klinik kurallarin otomatik guncellenmesi guvenli degildir.

on:
  schedule:
    # Her Pazartesi 06:00 UTC (Turkiye saatiyle 09:00)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Degisiklikler incelendi: kilit dosyasini guncelleyen bir PR ac'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sut-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Kaynaklari kontrol et
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kilit dosyasi var mi
        id: lock
        run: |
          if [ -f data/sources.lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Ilk calismada kilit yoktur: parmak izlerini tohumlayip PR acariz,
      # boylece "her kaynak yeni" diye bos yere konu acilmaz.
      - name: Kaynaklari getir (tohumlama)
        if: steps.lock.outputs.exists == 'false'
        run: node scripts/fetch-sources.mjs --write || true

      - name: Kaynaklari getir (karsilastirma)
        if: steps.lock.outputs.exists == 'true'
        id: fetch
        run: |
          set +e
          node scripts/fetch-sources.mjs
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Inceleme sonrasi elle tetiklenir: yeni parmak izlerini kabul eder.
      - name: Kilit dosyasini tazele (onay)
        if: inputs.acknowledge == true
        run: node scripts/fetch-sources.mjs --write || true

      - name: Guncellik raporu
        id: report
        run: |
          set +e
          node scripts/check-updates.mjs > /dev/null
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Kilit degisikligi icin PR ac
        if: steps.lock.outputs.exists == 'false' || inputs.acknowledge == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/sources.lock.json; then
            echo "Kilit dosyasinda degisiklik yok."
            exit 0
          fi
          BRANCH="chore/sut-lock-$(date -u +%Y%m%d%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/sources.lock.json
          git commit -m "chore: resmi kaynak parmak izlerini guncelle"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: resmi kaynak parmak izlerini guncelle" \
            --body-file .tmp-update-report.md \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --draft

      - name: Degisiklik varsa konu ac veya guncelle
        # Tohumlama ve onay calismalarinda konu acilmaz: o yollar zaten PR aciyor.
        if: >-
          (steps.fetch.outputs.code == '2' || steps.report.outputs.code == '2')
          && steps.lock.outputs.exists == 'true'
          && inputs.acknowledge != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="SUT kaynaklarinda degisiklik saptandi"
          EXISTING=$(gh issue list --state open --label sut-watch --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          # Etiketin var oldugundan emin ol (ilk calismada olmayabilir).
          gh label create sut-watch --description "Otomatik SUT kaynak izleme" --color 0E8A16 2>/dev/null || true

          {
            echo "Otomatik kontrol, izlenen resmi kaynaklarda degisiklik buldu."
            echo "Veri dosyalari **elle** gozden gecirilmelidir; bu is akisi klinik kurallari kendiliginden degistirmez."
            echo
            cat .tmp-update-report.md
            echo
            echo "---"
            echo "Inceleme bittiginde: Actions > \"SUT kaynak izleme\" > Run workflow > \`acknowledge\` isaretli calistirin."
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --label sut-watch --body-file issue-body.md
          fi
