name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Yayimla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Yayimlamadan once ciktinin kaynakla uyumlu oldugundan emin ol.
      - name: Dogrula ve derlemeyi karsilastir
        run: |
          npm run validate
          npm run check:build

      # Pages icin gereken dosyalar: uygulama, veri paketi, manifest.
      - name: Yayin klasorunu hazirla
        run: |
          mkdir -p _site
          cp index.html bundle.json manifest.webmanifest _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
